<div class="layout-controls" data-layout-controls hidden>
  <button type="button" class="action-secondary" data-layout-edit aria-expanded="false" aria-controls="layout-options">Edit layout</button>
  <span class="layout-save-status" role="status" aria-live="polite" data-layout-status></span>
  <button type="button" class="action-secondary" data-layout-retry hidden>Retry saving</button>
  <div id="layout-options" class="layout-options" hidden>
    <div><strong>Choose what appears on this page</strong><p>Hidden sections can be restored here. Your layout is saved to your account.</p></div>
    <div class="layout-options-list" data-layout-options></div>
    <div class="layout-options-actions"><button type="button" class="action-secondary" data-layout-collapse-all>Collapse summaries</button><button type="button" class="action-secondary" data-layout-expand-all>Expand summaries</button><button type="button" class="action-secondary" data-layout-reset>Restore default layout</button></div>
  </div>
</div>
